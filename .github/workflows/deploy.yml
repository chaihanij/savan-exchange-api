name: 🚀 Deploy to Railway

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Railway
        uses: railwayapp/cli-action@v4
        with:
          railwayToken: ${{ secrets.RAILWAY_TOKEN }}
